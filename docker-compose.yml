services:
  # SteemDB Sync Service (blockchain synchronization)
  steemdb-sync:
    build:
      context: .
      dockerfile: steemdb-sync/Dockerfile
    # ports:
    #   - "9091:9091"  # Metrics port
    environment:
      - DATABASE_MONGODB_URI=mongodb://mongo:27017/?replicaSet=rs0
      - DATABASE_REDIS_URI=redis://redis:6379
      - STEEM_NODES=https://api.steemit.com,https://api.steemitdev.com
      - LOG_LEVEL=info
    volumes:
      # Mount configuration directory from host to container
      # Edit steemdb-sync/configs/config.yaml on host to change application settings
      # Restart container after configuration changes: docker-compose restart steemdb-sync
      - ./steemdb-sync/configs:/app/configs
      - ./steemdb-sync/logs:/var/log
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    networks:
      - steemdb-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # SteemDB Web Service (includes Nginx + Go backend)
  steemdb-web:
    build:
      context: .
      dockerfile: steemdb-web/Dockerfile
    # ports:
    #   - "80:80"  # Nginx port
    #   - "9090:9090"  # Metrics port (if exposed)
    environment:
      - SERVER_MODE=production
      - DATABASE_MONGODB_URI=mongodb://mongo:27017/?replicaSet=rs0
      - DATABASE_REDIS_URI=redis://redis:6379
    volumes:
      # Mount configuration directory from host to container
      # Edit steemdb-web/configs/config.yaml on host to change application settings
      # Restart container after configuration changes: docker-compose restart steemdb-web
      - ./steemdb-web/configs:/app/configs
      - ./steemdb-web/logs:/app/logs
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    networks:
      - steemdb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Database
  mongo:
    image: mongo:6.0
    # ports:
    #   - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=steemdb
    volumes:
      - mongo_data:/data/db
      # Uncomment and create mongo-init.js if you need initialization scripts
      # - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    restart: unless-stopped
    networks:
      - steemdb-network
    command: mongod --bind_ip_all --replSet rs0
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Cache
  redis:
    image: redis:7-alpine
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
      # Uncomment and create redis.conf if you need custom Redis configuration
      # - ./steemdb-web/configs/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    networks:
      - steemdb-network
    # Uncomment if using custom redis.conf
    # command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    # ports:
    #   - "9091:9090"
    volumes:
      - ./steemdb-sync/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./steemdb-sync/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    restart: unless-stopped
    networks:
      - steemdb-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    # ports:
    #   - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      # Create monitoring/grafana directories if you need Grafana provisioning
      # - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      # - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    restart: unless-stopped
    networks:
      - steemdb-network
    depends_on:
      - prometheus

  # Note: Nginx is now integrated into steemdb-web container

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  steemdb-network:
    driver: bridge

