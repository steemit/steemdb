server:
  port: 8080
  host: "127.0.0.1"  # Listen only on localhost, Nginx will proxy requests
  mode: "development"
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s

database:
  mongodb:
    uri: "mongodb://localhost:27017"
    database: "steemdb"
    pool_size: 100
    timeout: 30s
  
  redis:
    addr: "localhost:6379"
    password: ""
    db: 0
    pool_size: 100
    dial_timeout: 5s
    read_timeout: 3s
    write_timeout: 3s

auth:
  jwt_secret: "your-secret-key-change-in-production"
  jwt_expiry: 24h
  refresh_expiry: 168h # 7 days

api:
  rate_limit:
    enabled: true
    requests_per_minute: 100
    burst: 20
  
  cors:
    enabled: true
    allowed_origins: ["http://localhost:3000", "http://localhost:5173"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["Content-Type", "Authorization"]
    allow_credentials: true

websocket:
  enabled: true
  path: "/ws"
  read_buffer_size: 1024
  write_buffer_size: 1024
  max_connections: 1000
  ping_period: 54s
  pong_wait: 60s
  write_wait: 10s

steem:
  nodes:
    - "https://api.steemit.com"
    - "https://api.steemitdev.com"
    - "https://anyx.io"
  timeout: 30s
  retry_attempts: 3

cache:
  enabled: true
  default_expiry: 5m
  cleanup_interval: 10m
  
  # Cache settings for different data types
  blocks:
    expiry: 1h
    max_items: 10000
  
  accounts:
    expiry: 10m
    max_items: 50000
  
  witnesses:
    expiry: 1m
    max_items: 1000

log:
  level: "debug"
  format: "text" # text or json
  file: ""
  max_size: 100 # MB
  max_backups: 5
  max_age: 30 # days
  compress: true

metrics:
  enabled: true
  port: 9090
  path: "/metrics"

monitoring:
  health_check_interval: 30s
  error_threshold: 10
  recovery_timeout: 2m
