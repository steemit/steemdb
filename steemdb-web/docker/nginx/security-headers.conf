# Shared security headers.
#
# nginx inheritance rule: a location that declares ANY add_header of its
# own (e.g. Cache-Control) inherits NOTHING from the http/server level,
# so its responses would ship without these headers. Therefore every
# location that uses add_header must also include this file.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
