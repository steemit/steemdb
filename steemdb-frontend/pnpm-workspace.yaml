allowBuilds:
  esbuild: true

# Security pins for transitive dependencies flagged by Dependabot.
# Scoped by major so a future consumer of a newer major is not forced back
# onto a vulnerable line; bump or drop an entry once its chain disappears.
minimumReleaseAgeExclude:
  - baseline-browser-mapping@2.11.32

overrides:
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  minimatch@3: 3.1.5
  minimatch@9: 9.0.9
  js-yaml@4: 4.3.2
  flatted@3: 3.4.4
  picomatch@2: 2.3.2
  picomatch@4: 4.0.7
  postcss-selector-parser@6: 6.1.5
  postcss@8: 8.5.31
  ajv@6: 6.15.0
  '@babel/core@7': 7.29.7
  browserslist@4: 4.29.4
  baseline-browser-mapping@2: 2.11.32
  nanoid@3: 3.3.20
  source-map-js@1: 1.2.2
  '@humanfs/node@0': 0.16.8
  rollup@4: 4.65.0
