services:
  # MongoDB Database
  mongo:
    image: mongo:4.4
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=steemdb
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - steemdb-network
    command: mongod --bind_ip_all
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis was removed: no test (and no web code path) ever used it.

volumes:
  mongo_data:
    driver: local

networks:
  steemdb-network:
    driver: bridge
