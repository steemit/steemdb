services:
  # MongoDB Database
  mongo:
    image: mongo:4.4
    container_name: cold-ingest-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-123456}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE:-steemdb_test}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - cold-ingest-network
    command: mongod --bind_ip_all
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')", "--username", "${MONGO_USERNAME:-admin}", "--password", "${MONGO_PASSWORD:-123456}", "--authenticationDatabase", "admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Cold Ingest Service
  cold-ingest:
    build:
      context: ../..
      dockerfile: test/docker-compose/Dockerfile.cold-ingest
    container_name: cold-ingest-service
    ports:
      - "${INGEST_PORT:-8080}:8080"
      - "${METRICS_PORT:-9090}:9090"
    environment:
      - CONFIG_PATH=/app/configs/config.yaml
      - MONGO_URI=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-123456}@mongo:27017/${MONGO_DATABASE:-steemdb_test}?authSource=admin
      - VALIDATE_RPC=${VALIDATE_RPC:-false}
      - RPC_API=${RPC_API:-https://api.steemit.com}
      - RPC_SAMPLE_RATE=${RPC_SAMPLE_RATE:-100}
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
      - ingest_data:/app/data
    networks:
      - cold-ingest-network
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Processor Service (consumes operations → derived collections)
  processor:
    build:
      context: ../..
      dockerfile: test/docker-compose/Dockerfile.cold-ingest
    container_name: cold-ingest-processor
    ports:
      - "9092:9092"
    environment:
      - CONFIG_PATH=/app/configs/config.yaml
      - MONGO_URI=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-123456}@mongo:27017/${MONGO_DATABASE:-steemdb_test}?authSource=admin
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
    networks:
      - cold-ingest-network
    depends_on:
      mongo:
        condition: service_healthy
    command: ["/app/processor", "-config", "/app/configs/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9092/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Refresher Service (witness/funds/stats/clients snapshots; legacy history.py + witnesses.py)
  refresher:
    build:
      context: ../..
      dockerfile: test/docker-compose/Dockerfile.cold-ingest
    container_name: cold-ingest-refresher
    ports:
      - "9093:9093"
    environment:
      - CONFIG_PATH=/app/configs/config.yaml
      - MONGO_URI=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-123456}@mongo:27017/${MONGO_DATABASE:-steemdb_test}?authSource=admin
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
    networks:
      - cold-ingest-network
    depends_on:
      mongo:
        condition: service_healthy
    command: ["/app/refresher", "-config", "/app/configs/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Steemd Node with Ingest Plugin
  steemd:
    image: ${STEEMD_IMAGE:-steemd:with-ingest}
    container_name: cold-ingest-steemd
    # RocksDB opens one fd per .sst file; at deep replay heights (>18M blocks)
    # the inherited soft limit (1024 on this host) causes EMFILE crashes.
    ulimits:
      nofile:
        soft: 524288
        hard: 524288
    environment:
      - INGEST_ENDPOINT=${INGEST_ENDPOINT:-http://cold-ingest:8080/ingest/applied_ops}
      - INGEST_HTTP_TIMEOUT=${INGEST_HTTP_TIMEOUT:-5000}
      - INGEST_QUEUE_SIZE=${INGEST_QUEUE_SIZE:-100000}
      - INGEST_BATCH_SIZE=${INGEST_BATCH_SIZE:-100}
      - INGEST_BATCH_TIMEOUT=${INGEST_BATCH_TIMEOUT:-1000}
      - STOP_REPLAY_AT_BLOCK=${STOP_REPLAY_AT_BLOCK:-0}
      - DATA_DIR=/var/steem
    volumes:
      - ../steem-test/data:/var/steem
      - ./steemd-entrypoint.sh:/entrypoint.sh:ro
    networks:
      - cold-ingest-network
    depends_on:
      cold-ingest:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    # Note: steemd will exit after replay completes (when STOP_REPLAY_AT_BLOCK is reached),
    # so we don't set restart policy to allow container to stop naturally

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  ingest_data:
    driver: local
  steemd_data:
    driver: local

networks:
  cold-ingest-network:
    driver: bridge
