server:
  port: 9090
  host: "0.0.0.0"
  mode: "production"

steem:
  nodes:
    - "https://api.steemit.com"
    - "https://api.steemitdev.com"
  timeout: 30s
  retry_attempts: 5

mongodb:
  uri: "${MONGODB_URI}"
  database: "steemdb"
  pool_size: 200
  timeout: 30s

redis:
  addr: "${REDIS_ADDR}"
  password: "${REDIS_PASSWORD}"
  db: 0
  pool_size: 200

sync:
  batch_size: 100
  workers: 20
  queue_size: 2000
  block_interval: 1s
  start_block: 1

history:
  batch_size: 100
  workers: 10
  interval: 6h
  account_scan_limit: 2000

witnesses:
  workers: 5
  interval: 1m
  check_interval: 5s

log:
  level: "info"
  format: "json"
  file: "/var/log/steemdb-sync.log"
  max_size: 500
  max_backups: 10
  max_age: 30

metrics:
  enabled: true
  port: 9091
  path: "/metrics"

monitoring:
  health_check_interval: 15s
  error_threshold: 50
  recovery_timeout: 2m
