server:
  port: 9090
  host: "127.0.0.1"
  mode: "development"

steem:
  nodes:
    - "http://192.168.30.23:8091"
  timeout: 30s
  retry_attempts: 3

mongodb:
  uri: "mongodb://localhost:27017"
  database: "steemdb_test"
  pool_size: 10
  timeout: 30s

redis:
  uri: "redis://localhost:6379"
  password: ""
  db: 1
  pool_size: 10

sync:
  batch_size: 100  # 小批量用于测试
  block_interval: 2s
  start_block: 1

history:
  batch_size: 10
  workers: 1
  interval: 1h
  account_scan_limit: 100

witnesses:
  workers: 1
  interval: 5m
  check_interval: 30s

log:
  level: "debug"
  format: "text"
  file: ""
  max_size: 10
  max_backups: 3
  max_age: 7

metrics:
  enabled: true
  port: 9091
  path: "/metrics"

monitoring:
  health_check_interval: 30s
  error_threshold: 5
  recovery_timeout: 1m
