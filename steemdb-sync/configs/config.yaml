server:
  port: 9090
  host: "0.0.0.0"
  mode: "development" # development, production

steem:
  nodes:
    - "https://api.steemit.com"
  timeout: 30s
  retry_attempts: 3

mongodb:
  uri: "mongodb://mongo:27017/steemdb?replicaSet=rs0"
  database: "steemdb"
  pool_size: 100
  timeout: 30s

redis:
  uri: "redis://redis:6379"
  password: ""
  db: 0
  pool_size: 100

sync:
  batch_size: 50
  block_batch_size: 50  # Blocks to fetch in one batch
  operation_batch_size: 100  # Operations to batch before write
  batch_write_interval: 5s  # Interval for flushing batches
  workers: 10
  queue_size: 1000
  block_interval: 3s
  start_block: 1

# History and Witnesses configurations are now integrated into CronTab service
# These configs are kept for backward compatibility but are no longer used as separate services
history:
  batch_size: 50
  workers: 5
  interval: 6h
  account_scan_limit: 1000

witnesses:
  workers: 2
  interval: 1m
  check_interval: 10s

log:
  level: "info" # debug, info, warn, error
  format: "json" # json, text
  file: "logs/steemdb-sync.log" # Relative to project root, or use absolute path like /var/log/steemdb-sync.log
  max_size: 100 # MB
  max_backups: 5
  max_age: 30 # days

metrics:
  enabled: true
  port: 9091
  path: "/metrics"

monitoring:
  health_check_interval: 30s
  error_threshold: 10
  recovery_timeout: 5m
