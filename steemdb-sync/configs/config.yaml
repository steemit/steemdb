# SteemDB Sync Configuration

# MongoDB connection settings
mongo:
  # MongoDB connection URI
  # Format: mongodb://[username:password@]host[:port][/database][?options]
  # Examples:
  #   - Without auth: mongodb://localhost:27017
  #   - With auth: mongodb://admin:123456@127.0.0.1:27017/steemdb_test?authSource=admin
  #   - With auth (different database): mongodb://user:pass@host:27017/mydb?authSource=admin
  # Note: Database name resolution priority:
  #   1. 'database' field (if set)
  #   2. Database name in URI (if present)
  #   3. Default value "steemdb"
  uri: "mongodb://admin:123456@127.0.0.1:27017/steemdb_test?authSource=admin"
  # database: "steemdb_test"  # Optional: if not set, will be parsed from URI or use default
  min_pool_size: 10
  max_pool_size: 100

# Steem RPC node settings
rpc:
  endpoint: "https://api.steemit.com"
  max_retry: 3
  timeout: "30s"

# Cold start phase settings
cold_start:
  target_height: 0  # Set to target block height for cold start
  safety_margin: 5  # Safety margin in blocks

# Batch processing settings
batch:
  size: 1000           # Number of operations per batch
  flush_interval: "1s" # Time interval for batch flush

# Ingest service settings (for cold_ingest)
ingest:
  listen_addr: ":8080"  # HTTP server listen address
  queue_size: 100000    # Maximum queue size for operations

# Logging settings
log:
  level: "info"   # debug, info, warn, error
  format: "text"   # text or json
