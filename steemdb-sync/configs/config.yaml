server:
  port: 9090
  host: "0.0.0.0"
  mode: "development" # development, production

steem:
  nodes:
    - "https://api.steemit.com"
    - "https://api.steemitdev.com"
    - "https://steemd.steemit.com"
  timeout: 30s
  retry_attempts: 3

mongodb:
  uri: "mongodb://localhost:27017"
  database: "steemdb"
  pool_size: 100
  timeout: 30s

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  pool_size: 100

sync:
  batch_size: 50
  workers: 10
  queue_size: 1000
  block_interval: 3s
  start_block: 1

history:
  batch_size: 50
  workers: 5
  interval: 6h
  account_scan_limit: 1000

witnesses:
  workers: 2
  interval: 1m
  check_interval: 10s

log:
  level: "info" # debug, info, warn, error
  format: "json" # json, text
  file: "/var/log/steemdb-sync.log"
  max_size: 100 # MB
  max_backups: 5
  max_age: 30 # days

metrics:
  enabled: true
  port: 9091
  path: "/metrics"

monitoring:
  health_check_interval: 30s
  error_threshold: 10
  recovery_timeout: 5m
