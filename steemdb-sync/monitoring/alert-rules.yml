groups:
  - name: steemdb-sync
    rules:
      # Service Health Alerts
      - alert: SteemDBSyncDown
        expr: up{job="steemdb-sync"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SteemDB Sync service is down"
          description: "SteemDB Sync service has been down for more than 1 minute"

      # Block Processing Alerts
      - alert: BlockProcessingStalled
        expr: increase(steemdb_blocks_processed_total[5m]) == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Block processing has stalled"
          description: "No blocks have been processed in the last 5 minutes"

      - alert: BlockProcessingSlowdown
        expr: rate(steemdb_blocks_processed_total[5m]) < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Block processing is slow"
          description: "Block processing rate is below 10 blocks/second for 5 minutes"

      # Error Rate Alerts
      - alert: HighErrorRate
        expr: rate(steemdb_errors_total[5m]) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 1 error/second for 2 minutes"

      - alert: CriticalErrorRate
        expr: rate(steemdb_errors_total[5m]) > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical error rate detected"
          description: "Error rate is above 5 errors/second for 1 minute"

      # Queue Size Alerts
      - alert: QueueBacklog
        expr: steemdb_queue_size > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Processing queue backlog"
          description: "Queue size is above 1000 items for 5 minutes"

      - alert: QueueOverflow
        expr: steemdb_queue_size > 5000
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Processing queue overflow"
          description: "Queue size is above 5000 items, system may be overloaded"

      # Performance Alerts
      - alert: SlowProcessing
        expr: histogram_quantile(0.95, rate(steemdb_processing_duration_seconds_bucket[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow processing detected"
          description: "95th percentile processing time is above 10 seconds"

      # Memory Usage Alerts
      - alert: HighMemoryUsage
        expr: steemdb_memory_usage_bytes{type="heap"} > 1073741824  # 1GB
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Heap memory usage is above 1GB for 5 minutes"

      # Database Alerts
      - alert: DatabaseConnectionFailure
        expr: rate(steemdb_database_operations_total{status="error"}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection issues"
          description: "Database error rate is above 0.1 errors/second"

      # RPC Alerts
      - alert: SteemRPCFailure
        expr: rate(steemdb_rpc_requests_total{status="error"}[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Steem RPC connection issues"
          description: "Steem RPC error rate is above 0.5 errors/second"

      - alert: SteemRPCCriticalFailure
        expr: rate(steemdb_rpc_requests_total{status="error"}[5m]) > 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical Steem RPC failures"
          description: "Steem RPC error rate is above 2 errors/second"

      # Witness Monitoring Alerts
      - alert: WitnessUpdateFailure
        expr: increase(steemdb_errors_total{service="witnesses"}[10m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Witness update failures"
          description: "Multiple witness update failures in the last 10 minutes"

      # History Service Alerts
      - alert: HistoryUpdateFailure
        expr: increase(steemdb_errors_total{service="history"}[1h]) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "History update failures"
          description: "Multiple history update failures in the last hour"
