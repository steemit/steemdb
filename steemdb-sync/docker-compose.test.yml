version: '3.8'

# Docker Compose configuration for testing
# This creates a temporary MongoDB instance for testing purposes
# Usage: docker-compose -f docker-compose.test.yml up -d
# Cleanup: docker-compose -f docker-compose.test.yml down -v

services:
  mongodb-test:
    image: mongo:4.4
    container_name: steemdb-sync-test-mongo
    ports:
      - "27018:27017"  # Use different port to avoid conflict with main MongoDB
    environment:
      MONGO_INITDB_DATABASE: steemdb
    volumes:
      - mongodb-test-data:/data/db
    # Note: For testing, we use standalone mode (no replica set)
    # This is simpler and sufficient for testing purposes
    command: mongod
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - steemdb-test-network

volumes:
  mongodb-test-data:
    driver: local

networks:
  steemdb-test-network:
    driver: bridge

