name: Build & Publish Images

# Builds and publishes versioned Docker images on every push to next.
#
# Image naming: steemit/steemdb-{service}
# Tag scheme:   {latest, branch}-{commit sha 7}   e.g.
#               steemit/steemdb-web:next-d56f619  +  steemit/steemdb-web:latest
#
# Services:
#   web  — frontend (vite) + Go API in one image  (steemdb-web/Dockerfile)
#   sync — one image, all five sync binaries      (steemdb-sync/Dockerfile.sync)
#          (processor / live_sync / refresher resident, cold_ingest + repair ad hoc)
on:
  push:
    branches: [next]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: steemdb-web/Dockerfile
            context: .
          - name: sync
            dockerfile: steemdb-sync/Dockerfile.sync
            context: steemdb-sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHA7="${GITHUB_SHA::7}"
          # branch names can contain characters invalid in a tag (e.g. '/'); sanitize
          SAFE_BRANCH="$(echo "$BRANCH" | sed 's|[^a-zA-Z0-9._-]|-|g')"
          echo "versioned=steemit/steemdb-${{ matrix.name }}:${SAFE_BRANCH}-${SHA7}" >> "$GITHUB_OUTPUT"
          echo "latest=steemit/steemdb-${{ matrix.name }}:latest" >> "$GITHUB_OUTPUT"
          echo "image=steemit/steemdb-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.versioned }}
            ${{ steps.tags.outputs.latest }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Image digest
        run: |
          echo "image: ${{ steps.tags.outputs.image }}"
          echo "tags:   ${{ steps.tags.outputs.versioned }}"
          echo "        ${{ steps.tags.outputs.latest }}"
